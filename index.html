
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebGIS GeoServer + LeafletJS</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>

        /* Mengatur halaman */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Area peta */
        #map {
            height: 100vh;
            width: 100vw;
        }

        /* Judul WebGIS */
        .judul {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 17px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        /* Panel legenda */
        .legend {
            background: white;
            padding: 12px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            max-height: 400px;
            overflow-y: auto;
            min-width: 160px;
        }

        /* Judul legenda */
        .legend h4 {
            margin: 0 0 12px 0;
            text-align: center;
            font-size: 14px;
        }

        /* Kelompok legenda */
        .legend-group {
            margin-bottom: 12px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }

        .legend-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .legend-group h5 {
            margin: 5px 0 8px;
            font-size: 13px;
        }

        .legend-group img {
            max-width: 180px;
            height: auto;
            display: block;
        }

    </style>

</head>

<body>


    <!-- Area peta -->
    <div id="map"></div>


    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        // 1. Membuat peta
        var map = L.map('map').setView([-8.6, 121.8], 8);


        // 2. Membuat basemap OpenStreetMap
        var osm = L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        // 3. Menghubungkan GeoServer
        var geoserver = 'http://localhost:8080/geoserver/pgweb/wms';


        // 4. Layer batas desa
        var batasDesa = L.tileLayer.wms(geoserver, {
            layers: 'pgweb:batas_desa-flores',
            format: 'image/png',
            transparent: true,
            version: '1.1.0'
        }).addTo(map);


        // 5. Layer jalan
        var jalan = L.tileLayer.wms(geoserver, {
            layers: 'pgweb:jalan',
            format: 'image/png',
            transparent: true,
            version: '1.1.0'
        });


        // 6. Layer toponimi
        var toponimi = L.tileLayer.wms(geoserver, {
            layers: 'pgweb:toponimi',
            format: 'image/png',
            transparent: true,
            version: '1.1.0'
        });


        // 7. Mengatur basemap
        var baseMaps = {
            "OpenStreetMap": osm
        };


        // 8. Mengatur overlay
        var overlayMaps = {
            "Batas Desa": batasDesa,
            "Jalan": jalan,
            "Toponimi": toponimi
        };


        // 9. Kontrol layer
        L.control.layers(baseMaps, overlayMaps, {
            collapsed: false
        }).addTo(map);


        // 10. Skala peta
        L.control.scale({
            position: 'bottomleft',
            metric: true,
            imperial: false
        }).addTo(map);


        // 11. Membuat legenda berdasarkan kelompok layer
        var legend = L.control({
            position: 'bottomright'
        });

        legend.onAdd = function(map) {

            var div = L.DomUtil.create('div', 'legend');

            div.innerHTML = `
                <h4>LEGENDA PETA</h4>

                <div class="legend-group">
                    <h5>1. Batas Desa</h5>
                    <img src="http://localhost:8080/geoserver/pgweb/wms?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&LAYER=pgweb:batas_desa-flores">
                </div>

                <div class="legend-group">
                    <h5>2. Jalan</h5>
                    <img src="http://localhost:8080/geoserver/pgweb/wms?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&LAYER=pgweb:jalan">
                </div>

                <div class="legend-group">
                    <h5>3. Toponimi</h5>
                    <img src="http://localhost:8080/geoserver/pgweb/wms?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&LAYER=pgweb:toponimi">
                </div>
            `;

            L.DomEvent.disableClickPropagation(div);

            return div;
        };

        // 12. Menampilkan legenda
        legend.addTo(map);

    </script>

</body>
</html>
